name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: bash serve/bin/serve-stack build
      - name: Lint
        run: bash serve/bin/serve-stack lint
      - name: Test the service
        run: bash serve/bin/serve-stack test
      - name: Test the tools
        run: bash serve/bin/serve-stack tools-test
